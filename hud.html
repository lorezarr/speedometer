<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>GOLDEN BAKU HUD</title>
<style>
  :root { --glass: rgba(13,17,23,.85); --gold: #e3b341; --red: #e5484d; --blue: #4c9be8;
          --text: #f2f4f7; --muted: #9aa4b2; }
  html, body { margin: 0; height: 100%; background: transparent; overflow: hidden;
    font-family: "Segoe UI", Tahoma, Arial, sans-serif; color: var(--text); user-select: none; }

  #hud { position: fixed; top: 24px; right: 24px; width: 270px; padding: 14px 18px;
    background: var(--glass); border: 1px solid rgba(255,255,255,.14);
    border-left: 4px solid var(--gold); border-radius: 10px; }
  .top { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 10px; }
  .top h1 { margin: 0; font-size: 17px; color: var(--gold); }
  #clock { font-size: 20px; font-weight: 700; font-variant-numeric: tabular-nums; }

  .stat { display: flex; justify-content: space-between; font-size: 14px; color: var(--muted); }
  .stat b { color: var(--text); font-variant-numeric: tabular-nums; }
  .track { height: 10px; background: rgba(255,255,255,.1); border-radius: 5px; overflow: hidden; margin: 3px 0 9px; }
  .fill { height: 100%; width: 0; border-radius: 5px; transition: width .25s; }
  #hp { background: var(--red); } #armor { background: var(--blue); }

  .weapon { display: flex; align-items: center; gap: 12px; margin-top: 4px; padding-top: 10px;
    border-top: 1px solid rgba(255,255,255,.12); }
  #wIcon { width: 64px; height: 32px; color: var(--text); flex: none; }
  #wName { font-size: 14px; color: var(--muted); }
  #wAmmo { margin-left: auto; font-size: 22px; font-weight: 700; font-variant-numeric: tabular-nums; }
</style>
</head>
<body>

<div id="hud">
  <div class="top"><h1>GOLDEN BAKU</h1><span id="clock">--:--</span></div>

  <div class="stat">Здоровье <b id="hpNum">100</b></div>
  <div class="track"><div class="fill" id="hp"></div></div>

  <div class="stat">Броня <b id="armorNum">0</b></div>
  <div class="track"><div class="fill" id="armor"></div></div>

  <div class="weapon">
    <svg id="wIcon" viewBox="0 0 64 32" fill="currentColor"></svg>
    <span id="wName">Кулаки</span>
    <span id="wAmmo"></span>
  </div>
</div>

<script>
  // Значки оружия: простые силуэты
  var ICONS = {
    fist:    '<rect x="14" y="10" width="36" height="16" rx="6"/><circle cx="20" cy="10" r="5"/><circle cx="29" cy="9" r="5"/><circle cx="38" cy="9" r="5"/><circle cx="47" cy="10" r="5"/>',
    knife:   '<path d="M4 19 L40 10 L40 17 L14 21 Z"/><rect x="40" y="10" width="20" height="8" rx="3"/>',
    bat:     '<rect x="4" y="13" width="46" height="6" rx="3"/><rect x="40" y="9" width="20" height="14" rx="7"/>',
    pistol:  '<rect x="8" y="8" width="42" height="10" rx="2"/><path d="M34 18 H48 L44 30 H33 Z"/>',
    smg:     '<rect x="6" y="9" width="44" height="9" rx="2"/><path d="M36 18 h9 l-3 12 h-9 z"/><rect x="20" y="18" width="6" height="12"/><rect x="50" y="11" width="10" height="4"/>',
    shotgun: '<rect x="4" y="10" width="44" height="5"/><path d="M48 10 h12 l-4 13 h-8 z"/><rect x="18" y="15" width="14" height="5" rx="2"/>',
    rifle:   '<rect x="2" y="12" width="12" height="3"/><rect x="10" y="10" width="36" height="8" rx="2"/><path d="M46 10 h14 l-3 13 h-11 z"/><path d="M24 18 h6 l2 12 h-6 z"/>',
    sniper:  '<rect x="2" y="13" width="54" height="4"/><rect x="18" y="6" width="18" height="5" rx="2"/><path d="M44 12 h16 l-3 12 h-12 z"/>',
    grenade: '<circle cx="32" cy="19" r="11"/><rect x="28" y="3" width="8" height="7" rx="2"/><rect x="36" y="5" width="10" height="3"/>',
    rocket:  '<rect x="4" y="11" width="50" height="10" rx="3"/><path d="M54 11 L62 16 L54 21 Z"/>'
  };

  // ID оружия SA-MP -> [значок, название]
  var WEAPONS = {
    0:['fist','Кулаки'], 1:['fist','Кастет'],
    2:['bat','Клюшка'], 3:['bat','Дубинка'], 4:['knife','Нож'], 5:['bat','Бита'],
    6:['bat','Лопата'], 7:['bat','Кий'], 8:['knife','Катана'], 9:['knife','Бензопила'],
    15:['bat','Трость'],
    16:['grenade','Граната'], 17:['grenade','Слезоточивый газ'], 18:['grenade','Молотов'], 39:['grenade','Взрывчатка'],
    22:['pistol','Пистолет'], 23:['pistol','Пистолет с глушителем'], 24:['pistol','Desert Eagle'], 32:['pistol','Tec-9'],
    25:['shotgun','Дробовик'], 26:['shotgun','Обрез'], 27:['shotgun','SPAS-12'],
    28:['smg','Uzi'], 29:['smg','MP5'],
    30:['rifle','AK-47'], 31:['rifle','M4'],
    33:['sniper','Винтовка'], 34:['sniper','Снайперская винтовка'],
    35:['rocket','РПГ'], 36:['rocket','Самонаводящийся РПГ'], 37:['rocket','Огнемёт'], 38:['rocket','Миниган']
  };
  var MELEE = {0:1,1:1,2:1,3:1,4:1,5:1,6:1,7:1,8:1,9:1,15:1};

  function $(id) { return document.getElementById(id); }

  function setHud(hp, armor, weapon, ammo) {
    hp = Math.max(0, Math.min(100, hp));
    armor = Math.max(0, Math.min(100, armor));
    $('hp').style.width = hp + '%';       $('hpNum').textContent = hp;
    $('armor').style.width = armor + '%'; $('armorNum').textContent = armor;

    var w = WEAPONS[weapon] || ['fist', 'Кулаки'];
    $('wIcon').innerHTML = ICONS[w[0]];
    $('wName').textContent = w[1];
    $('wAmmo').textContent = MELEE[weapon] || !WEAPONS[weapon] ? '' : ammo;
  }

  // Время компьютера игрока
  function clock() {
    var d = new Date();
    $('clock').textContent = ('0' + d.getHours()).slice(-2) + ':' + ('0' + d.getMinutes()).slice(-2);
  }
  clock(); setInterval(clock, 1000);

  setHud(100, 0, 0, 0);

  if (window.cef) {
    // Сервер шлёт: здоровье, броня, ID оружия, патроны
    cef.on('update_hud', function (hp, armor, weapon, ammo) {
      setHud(Math.round(hp), Math.round(armor), weapon, ammo);
    });
  } else {
    // В обычном браузере: показываем пример, чтобы было видно, как выглядит
    setHud(80, 50, 24, 42);
  }
</script>
</body>
</html>
