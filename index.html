<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>GOLDEN BAKU Speedometer</title>
<style>
  :root { --glass: rgba(13,17,23,.85); --gold: #e3b341; --text: #f2f4f7; --muted: #9aa4b2; }
  html, body { margin: 0; height: 100%; background: transparent; overflow: hidden;
    font-family: "Segoe UI", Tahoma, Arial, sans-serif; color: var(--text); user-select: none; }

  #speedo { position: fixed; bottom: 40px; right: 40px; width: 150px; height: 150px; border-radius: 50%;
    background: var(--glass); border: 3px solid var(--gold);
    display: flex; flex-direction: column; align-items: center; justify-content: center; }
  #speedVal { font-size: 52px; font-weight: 700; line-height: 1; font-variant-numeric: tabular-nums; }
  #speedo small { margin-top: 4px; font-size: 14px; color: var(--muted); }
</style>
</head>
<body>

<div id="speedo">
  <div id="speedVal">0</div>
  <small>км/ч</small>
</div>

<script>
  if (window.cef) {
    // Сервер шлёт одно число: скорость в км/ч
    cef.on('update_speed', function (speed) {
      document.getElementById('speedVal').textContent = Math.round(speed);
    });
  } else {
    // В обычном браузере: пример, чтобы увидеть внешний вид
    document.getElementById('speedVal').textContent = 87;
  }
</script>
</body>
</html>
